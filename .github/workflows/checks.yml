name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_auth -v
      - run: python check_public.py
      - run: node --check dist/app.js && node --check dist/intro.js && node --check dist/motion.js && node --check dist/pwa.js && node --check dist/sw.js
